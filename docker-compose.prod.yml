# Coolify production deploy — sadece PostgREST
# PostgreSQL Coolify database servisi olarak ayrı kurulu
services:
  api:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_SERVER_PORT: "3000"
      PGRST_JWT_SECRET: ""
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
